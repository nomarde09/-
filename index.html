<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Мой watchlist</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Мой watchlist</h1>
  <p>Фильмы и сериалы: хочу посмотреть, смотрю, просмотрено.</p>

  <form id="add-form">
    <label for="title-input">Название</label>
    <input type="text" id="title-input" name="title" placeholder="Например, Дюна" required>

    <label for="type-select">Тип</label>
    <select id="type-select" name="type">
      <option value="movie">Фильм</option>
      <option value="series">Сериал</option>
    </select>

    <button type="submit">Добавить</button>
  </form>

  <p id="empty-message">Список пока пуст.</p>
  <ul id="item-list"></ul>

  <script src="app.js"></script>
</body>
</html>
